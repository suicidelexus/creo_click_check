# ClickTag Cleaner next to Glazok on the shared server (work network / VPN only).
server {
  listen 8091;
  # 50 archives x 50 MB is the app-side ceiling; keep nginx out of the way.
  client_max_body_size 500m;
  location / {
    proxy_pass http://127.0.0.1:3091;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
